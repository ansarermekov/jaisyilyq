<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="JAISYILYQ — новогодние подарочные боксы и игрушки. Заказ через WhatsApp.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎁%3C/text%3E%3C/svg%3E">
<title>JAISYILYQ — новогодние подарочные боксы</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<style>
:root{--cream:#fbf5ea;--milk:#fffaf2;--beige:#eadcc4;--wine:#7a1f2b;--pine:#2f4a3a;--gold:#c9a24b;--ink:#3a2a26;--card:#fffdf8;--shadow:rgba(90,50,30,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#1e1715;--milk:#271d1a;--beige:#4a3a30;--wine:#e08a93;--pine:#8fb59d;--gold:#e0bb62;--ink:#f3e8d8;--card:#2c211d;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--cream:#1e1715;--milk:#271d1a;--beige:#4a3a30;--wine:#e08a93;--pine:#8fb59d;--gold:#e0bb62;--ink:#f3e8d8;--card:#2c211d;--shadow:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;overflow-x:hidden}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
.lights{display:flex;justify-content:space-around;height:26px;overflow:hidden}
.bulb{width:10px;height:14px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;margin-top:6px;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55;box-shadow:0 0 4px currentColor}50%{opacity:1;box-shadow:0 0 14px 3px currentColor}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:999px;font-weight:500;font-size:15px;transition:all .3s;cursor:pointer;border:1px solid transparent;text-decoration:none;min-height:46px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--shadow)}
.b1{background:var(--wine);color:#fff7ea}.b2{background:transparent;border-color:var(--gold);color:var(--ink)}.b3{background:#25a244;color:#fff}
:root:not([data-theme="light"]) .b1{color:#2a1511}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 30px var(--shadow);transition:transform .4s,box-shadow .4s;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px var(--shadow)}
.flake{position:absolute;color:var(--gold);opacity:.5;animation:fall linear infinite;pointer-events:none}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(105vh)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.85}}
@keyframes climb{0%,100%{transform:translateY(0)}50%{transform:translateY(84px)}}
@keyframes up{0%,20%{transform:translateY(0)}50%,70%{transform:translateY(-26px)}100%{transform:translateY(0)}}
@keyframes ext{0%,20%{transform:scaleY(1)}50%,70%{transform:scaleY(2)}100%{transform:scaleY(1)}}
.pl{animation:pulse 3s ease-in-out infinite}.cl{animation:climb 4s ease-in-out infinite}.up{animation:up 5s ease-in-out infinite}.lg{transform-box:fill-box;transform-origin:top;animation:ext 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bulb,.flake,.pl,.cl,.up,.lg{animation:none}.rv{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const html = htm.bind(React.createElement);
const {useState,useEffect,useRef} = React;

/* ===== ДАННЫЕ — редактируйте здесь ===== */
const WA = "77786842411";
const IG = "https://www.instagram.com/jaisyilyq/";
const PLACEHOLDER_PRICE = "Стоимость уточняется";
const palette = [["#7a1f2b","#c9a24b"],["#2f4a3a","#e8d4a2"],["#a8323f","#f3e3c3"],["#c9a24b","#7a1f2b"],["#3d5e49","#c9a24b"],["#8c2a38","#e8d4a2"],["#d9c3a0","#7a1f2b"]];
const BOXES = Array.from({length:7},(_,i)=>{const n=String(i+1).padStart(2,"0");return{
  id:i+1,name:`Box ${n}`,short:"Краткое описание бокса появится здесь.",
  description:"Подробное описание бокса будет добавлено позже. Здесь можно рассказать об атмосфере и идее подарка.",
  items:["Состав будет добавлен","Позиция 2 — уточняется","Позиция 3 — уточняется"],
  price:PLACEHOLDER_PRICE,colors:palette[i],image:null}});
const FAQ = [
 ["Как заказать бокс?","Выберите бокс, нажмите «Заказать» — откроется WhatsApp с готовым сообщением."],
 ["Как узнать состав?","Нажмите «Подробнее» на карточке бокса или уточните состав в WhatsApp."],
 ["Как узнать стоимость?","Стоимость каждого бокса уточняется в WhatsApp или в Instagram."],
 ["Как связаться с нами?","Напишите нам в WhatsApp или Instagram — ссылки ниже и в шапке сайта."]];
const waLink = n => `https://wa.me/${WA}?text=${encodeURIComponent(n?`Здравствуйте! Хочу заказать ${n}. Подскажите, пожалуйста, подробности`:"Здравствуйте! Хочу узнать о новогодних боксах JAISYILYQ")}`;

/* ===== Иконки ===== */
const I = ({d,s=20}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${d}</svg>`;
const IcWA = () => html`<${I} d=${html`<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 9c0 3 3 6 6 6l1.5-1.5-2-1-1 .8c-1-.4-2-1.400-2.400-2.400l.8-1-1-2z"/>`}/>`;
const IcIG = () => html`<${I} d=${html`<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".6"/>`}/>`;
const IcGift = () => html`<${I} s=${28} d=${html`<rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M5 12v9h14v-9M7.500 8a2.500 2.500 0 1 1 0-5C10 3 12 8 12 8s2-5 4.500-5a2.500 2.500 0 1 1 0 5"/>`}/>`;
const IcHeart = () => html`<${I} s=${28} d=${html`<path d="M12 21s-8-5-8-11a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 6-8 11-8 11z"/>`}/>`;
const IcStar = () => html`<${I} s=${28} d=${html`<path d="M12 3l2.600 5.600 6 .7-4.500 4.100 1.200 6L12 16.400 6.700 19.400l1.200-6L3.400 9.300l6-.7z"/>`}/>`;
const IcSnow = () => html`<${I} s=${28} d=${html`<path d="M12 2v20M4 7l16 10M20 7L4 17"/>`}/>`;
const IcClose = () => html`<${I} d=${html`<path d="M6 6l12 12M18 6L6 18"/>`}/>`;
const IcPlus = () => html`<${I} d=${html`<path d="M12 5v14M5 12h14"/>`}/>`;

/* ===== Иллюстрация бокса ===== */
const BoxArt = ({colors,label,big}) => { const [a,b]=colors; return html`
<svg viewBox="0 0 240 220" className=${big?"w-full h-auto":"w-full h-full"} role="img" aria-label=${"Подарочный бокс "+label}>
  <ellipse cx="120" cy="200" rx="86" ry="10" fill="#000" opacity=".12"/>
  <rect x="42" y="92" width="156" height="104" rx="6" fill=${a}/>
  <rect x="34" y="68" width="172" height="34" rx="6" fill=${a}/>
  <rect x="34" y="94" width="172" height="8" fill="#000" opacity=".12"/>
  <rect x="108" y="68" width="24" height="128" fill=${b}/>
  <path d="M120 68C96 26 56 36 74 58c10 12 34 10 46 10zM120 68c24-42 64-32 46-10-10 12-34 10-46 10z" fill=${b} stroke=${a} strokeWidth="2"/>
  <circle cx="120" cy="66" r="9" fill=${b} stroke=${a} strokeWidth="2"/>
  <g fill=${b} opacity=".9"><circle cx="64" cy="130" r="2"/><circle cx="84" cy="160" r="2"/><circle cx="158" cy="124" r="2"/><circle cx="176" cy="168" r="2"/></g>
</svg>`};

const useReveal = () => { const r=useRef(); useEffect(()=>{const el=r.current;if(!el)return;const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add("in");o.disconnect()}},{threshold:.12});o.observe(el);return()=>o.disconnect()},[]);return r };
const Rv = ({children,className="",...p}) => { const r=useReveal(); return html`<div ref=${r} className=${"rv "+className} ...${p}>${children}</div>` };

const Lights = () => html`<div className="lights" aria-hidden="true">${Array.from({length:22},(_,i)=>html`<span key=${i} className="bulb" style=${{color:["#c9a24b","#a8323f","#6f9a7e","#e8d4a2"][i%4],background:"currentColor",animationDelay:(i%6)*.5+"s"}}/>`)}</div>`;

const Header = () => html`
<header className="sticky top-0 z-40 backdrop-blur" style=${{background:"color-mix(in srgb, var(--cream) 88%, transparent)",paddingTop:"env(safe-area-inset-top,0px)"}}>
  <${Lights}/>
  <div className="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
    <a href="#top" className="serif text-2xl sm:text-3xl font-bold tracking-wide" style=${{color:"var(--wine)"}}>JAISYILYQ</a>
    <nav className="hidden md:flex gap-7 text-sm"><a href="#boxes">Боксы</a><a href="#toyshome">Игрушки</a><a href="#why">О нас</a><a href="#how">Как заказать</a><a href="#faq">FAQ</a><a href="#contacts">Контакты</a></nav>
    <div className="flex gap-2">
      <a className="btn b2 !px-3 !py-2 !min-h-0" href=${IG} target="_blank" rel="noopener noreferrer" aria-label="Instagram"><${IcIG}/><span className="hidden sm:inline">Instagram</span></a>
      <a className="btn b3 !px-3 !py-2 !min-h-0" href=${waLink()} target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><${IcWA}/><span className="hidden sm:inline">WhatsApp</span></a>
    </div>
  </div>
</header>`;

const Hero = () => html`
<section id="top" className="relative overflow-hidden" style=${{background:"radial-gradient(ellipse at 70% 30%, color-mix(in srgb,var(--gold) 28%,transparent), transparent 60%), linear-gradient(var(--milk),var(--cream))"}}>
  ${[8,22,40,58,75,90].map((l,i)=>html`<span key=${i} className="flake text-xl" style=${{left:l+"%",animationDuration:(14+i*3)+"s",animationDelay:(-i*4)+"s"}}>✦</span>`)}
  <div className="max-w-6xl mx-auto px-4 py-14 md:py-24 grid md:grid-cols-2 gap-10 items-center relative">
    <div>
      <p className="tracking-[.3em] text-xs uppercase mb-4" style=${{color:"var(--gold)"}}>Новогодние подарочные боксы</p>
      <h1 className="serif text-5xl sm:text-6xl lg:text-7xl leading-[1.05] font-semibold" style=${{color:"var(--wine)"}}>Дарите тепло этой зимой</h1>
      <p className="mt-5 text-lg max-w-md opacity-80">Подарки, созданные с любовью и новогодним настроением.</p>
      <div className="mt-8 flex flex-wrap gap-3">
        <a href="#boxes" className="btn b1">Выбрать подарок</a>
        <a href="#boxes" className="btn b2">Посмотреть боксы</a>
      </div>
    </div>
    <div className="relative max-w-sm mx-auto w-full">
      <div className="absolute inset-0 rounded-full blur-3xl opacity-40" style=${{background:"var(--gold)"}}/>
      <div className="relative" style=${{animation:"glow 6s ease-in-out infinite",filter:"drop-shadow(0 20px 30px var(--shadow))"}}><${BoxArt} colors=${palette[0]} label="JAISYILYQ" big=${true}/></div>
    </div>
  </div>
</section>`;

const BoxCard = ({box,onOpen}) => html`
<${Rv} className="card flex flex-col">
  <button onClick=${()=>onOpen(box)} className="block w-full p-6 pb-2 text-left" aria-label=${"Подробнее о "+box.name} style=${{background:"linear-gradient(var(--milk),var(--card))"}}>
    <div className=${box.feat?"aspect-[4/5]":"aspect-[6/5]"}>${box.image?html`<img src=${box.image} alt=${box.name} className="w-full h-full object-contain" loading="lazy"/>`:box.art?box.art():html`<${BoxArt} colors=${box.colors} label=${box.name}/>`}</div>
  </button>
  <div className="p-6 pt-3 flex flex-col gap-2 flex-1">
    <h3 className="serif text-3xl font-semibold" style=${{color:"var(--wine)"}}>${box.name}</h3>
    <p className="opacity-75 text-sm">${box.short}</p>${box.feat&&html`<p className="text-xs self-start px-3 py-1 rounded-full" style=${{border:"1px solid var(--gold)",color:"var(--pine)"}}>✦ ${box.feat}</p>`}
    <p className="text-sm font-medium" style=${{color:"var(--pine)"}}>${box.price}</p>
    <div className="mt-auto pt-3 grid grid-cols-2 gap-2">
      <button className="btn b2 !px-3" onClick=${()=>onOpen(box)}>Подробнее</button>
      <a className="btn b3 !px-3" href=${waLink(box.order||box.name)} target="_blank" rel="noopener noreferrer"><${IcWA}/>Заказать</a>
    </div>
  </div>
</${Rv}>`;

const Modal = ({box,onClose}) => {
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",k);document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=""}},[]);
  return html`
  <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-6" style=${{background:"rgba(40,20,15,.6)"}} onClick=${onClose} role="dialog" aria-modal="true">
    <div className="w-full max-w-3xl max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 sm:p-8 grid sm:grid-cols-2 gap-6" style=${{background:"var(--cream)"}} onClick=${e=>e.stopPropagation()}>
      <div className="rounded-2xl p-4" style=${{background:"var(--milk)"}}>${box.image?html`<img src=${box.image} alt=${box.name} className="w-full max-h-[60vh] object-contain mx-auto"/>`:box.art?box.art(true):html`<${BoxArt} colors=${box.colors} label=${box.name} big=${true}/>`}</div>
      <div className="flex flex-col gap-3">
        <h2 className="serif text-4xl font-semibold" style=${{color:"var(--wine)"}}>${box.name}</h2>
        <p className="opacity-80">${box.description}</p>
        <div><p className="font-medium mb-1">${box.feat?"Особенности":"Состав подарка"}</p><ul className="text-sm opacity-80 space-y-1">${box.items.map((t,i)=>html`<li key=${i}>✦ ${t}</li>`)}</ul></div>
        <p className="text-lg font-medium" style=${{color:"var(--pine)"}}>${box.price}</p>
        <a className="btn b3" href=${waLink(box.order||box.name)} target="_blank" rel="noopener noreferrer"><${IcWA}/>Заказать в WhatsApp</a>
        <button className="btn b2" onClick=${onClose}>← Вернуться в каталог</button>
      </div>
    </div>
  </div>`};

const Why = () => { const w=[[IcHeart,"Подарки с любовью","Каждый бокс собирается с вниманием к деталям."],[IcGift,"Эстетичная упаковка","Красивая коробка, ленты и тёплые акценты."],[IcSnow,"Уютное настроение","Атмосфера зимнего вечера в каждом боксе."],[IcStar,"Дарите эмоции","Порадуйте близких тёплым новогодним сюрпризом."]];
 return html`<section id="why" className="py-16" style=${{background:"var(--milk)"}}><div className="max-w-6xl mx-auto px-4">
  <h2 className="serif text-4xl sm:text-5xl text-center mb-10" style=${{color:"var(--wine)"}}>Почему выбирают нас</h2>
  <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">${w.map(([Ic,t,d],i)=>html`<${Rv} key=${i} className="text-center p-6 rounded-3xl" style=${{border:"1px solid var(--beige)"}}><div className="inline-flex mb-3" style=${{color:"var(--gold)"}}><${Ic}/></div><h3 className="serif text-2xl mb-1">${t}</h3><p className="text-sm opacity-75">${d}</p></${Rv}>`)}</div></div></section>`};

const How = () => html`<section id="how" className="py-16 max-w-5xl mx-auto px-4">
  <h2 className="serif text-4xl sm:text-5xl text-center mb-10" style=${{color:"var(--wine)"}}>Как заказать</h2>
  <div className="grid md:grid-cols-3 gap-5">${["Выберите понравившийся бокс","Нажмите кнопку заказа","Оформите заказ через WhatsApp"].map((t,i)=>html`<${Rv} key=${i} className="card p-6 text-center"><div className="serif text-6xl" style=${{color:"var(--gold)"}}>${i+1}</div><p className="mt-2">${t}</p></${Rv}>`)}</div></section>`;

const Faq = () => { const [o,setO]=useState(0); return html`<section id="faq" className="py-16 max-w-3xl mx-auto px-4">
  <h2 className="serif text-4xl sm:text-5xl text-center mb-8" style=${{color:"var(--wine)"}}>Частые вопросы</h2>
  <div className="space-y-3">${FAQ.map(([q,a],i)=>html`<div key=${i} className="card"><button className="w-full flex justify-between items-center gap-3 p-5 text-left font-normal" aria-expanded=${o===i} onClick=${()=>setO(o===i?-1:i)}>${q}<span style=${{transition:"transform .3s",transform:o===i?"rotate(45deg)":"none",color:"var(--gold)"}}><${IcPlus}/></span></button>${o===i&&html`<p className="px-5 pb-5 opacity-80">${a}</p>`}</div>`)}</div></section>`};

const Contacts = () => html`<section id="contacts" className="py-16 px-4" style=${{background:"linear-gradient(135deg,var(--pine),#1f3329)",color:"#fbf5ea"}}>
  <div className="max-w-3xl mx-auto text-center">
    <h2 className="serif text-4xl sm:text-5xl mb-3">Напишите нам</h2>
    <p className="opacity-85 mb-8">Поможем выбрать бокс и ответим на все вопросы.</p>
    <div className="flex flex-wrap justify-center gap-3">
      <a className="btn b3" href=${waLink()} target="_blank" rel="noopener noreferrer"><${IcWA}/>WhatsApp +7 778 684 24 11</a>
      <a className="btn" style=${{background:"#fbf5ea",color:"#7a1f2b"}} href=${IG} target="_blank" rel="noopener noreferrer"><${IcIG}/>Наш Instagram</a>
    </div></div></section>`;

const Footer = () => html`<footer className="py-8 px-4 text-center text-sm" style=${{paddingBottom:"96px"}}>
  <p className="serif text-2xl" style=${{color:"var(--wine)"}}>JAISYILYQ</p>
  <p className="opacity-70 mt-1">Новогодние подарочные боксы</p>
  <div className="flex justify-center gap-5 mt-3"><a href=${IG} target="_blank" rel="noopener noreferrer" className="inline-flex gap-1 items-center"><${IcIG}/>Instagram</a><a href=${waLink()} target="_blank" rel="noopener noreferrer" className="inline-flex gap-1 items-center"><${IcWA}/>WhatsApp</a></div>
  <p className="opacity-50 mt-4">© JAISYILYQ</p></footer>`;

/* ===== НОВОГОДНИЕ ИГРУШКИ — редактируйте здесь ===== */
const Frame = ({big,children}) => html`<svg viewBox="0 0 240 220" className=${big?"w-full h-auto":"w-full h-full"} role="img" aria-label="Новогодняя игрушка"><ellipse cx="120" cy="204" rx="70" ry="7" fill="#000" opacity=".12"/>${children}</svg>`;
const SantaG = () => html`<path d="M84 104h72l8 88H76z" fill="#a8323f"/><rect x="76" y="140" width="88" height="10" fill="#3a2a26"/><rect x="112" y="138" width="16" height="14" fill="#c9a24b"/><circle cx="120" cy="76" r="26" fill="#f1cfb5"/><path d="M94 82q26 52 52 0q-4 30-26 34q-22-4-26-34z" fill="#fffaf2"/><path d="M92 66L124 14l24 52z" fill="#a8323f"/><rect x="92" y="62" width="56" height="12" rx="6" fill="#fffaf2"/><circle cx="126" cy="14" r="7" fill="#fffaf2"/><circle cx="110" cy="74" r="2" fill="#3a2a26"/><circle cx="130" cy="74" r="2" fill="#3a2a26"/>`;

const ToysHome = ({onOpen}) => html`<section id="toyshome" className="py-16" style=${{background:"var(--milk)"}}><div className="max-w-6xl mx-auto px-4">
 <div className="text-center mb-10"><h2 className="serif text-4xl sm:text-5xl" style=${{color:"var(--wine)"}}>Новогодние игрушки</h2><p className="opacity-70 mt-2">Маленькие детали, которые создают большое праздничное настроение</p></div>
 <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${[TOYS[0],TOYS[2],TOYS[3]].map(t=>html`<${BoxCard} key=${t.id} box=${t} onOpen=${onOpen}/>`)}</div>
 <div className="text-center mt-10"><a href="#toys" className="btn b1">Смотреть все игрушки</a></div></div></section>`;
const ToysPage = ({onOpen}) => html`<main className="max-w-6xl mx-auto px-4 py-12">
 <a href="#top" className="text-sm opacity-70">← На главную</a>
 <div className="text-center my-8"><h1 className="serif text-5xl sm:text-6xl" style=${{color:"var(--wine)"}}>Новогодние игрушки</h1><p className="opacity-70 mt-2">Маленькие детали, которые создают большое праздничное настроение</p></div>
 <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${TOYS.map(t=>html`<${BoxCard} key=${t.id} box=${t} onOpen=${onOpen}/>`)}</div></main>`;

const App = () => { const [sel,setSel]=useState(null); const [pg,setPg]=useState(location.hash==="#toys"?"toys":"home");
 useEffect(()=>{const f=()=>{const t=location.hash==="#toys";setPg(t?"toys":"home");setSel(null);setTimeout(()=>{if(t)window.scrollTo(0,0);else{const e=document.getElementById(location.hash.slice(1));e?e.scrollIntoView():window.scrollTo(0,0)}},60)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
 return html`<${React.Fragment}>
  <${Header}/><main className=${pg==="toys"?"hidden":""}>
  <${Hero}/>
  <section id="boxes" className="max-w-6xl mx-auto px-4 py-16">
    <div className="text-center mb-10"><h2 className="serif text-4xl sm:text-5xl" style=${{color:"var(--wine)"}}>Наши боксы</h2><p className="opacity-70 mt-2">Семь подарков для тёплой новогодней ночи</p></div>
    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${BOXES.map(b=>html`<${BoxCard} key=${b.id} box=${b} onOpen=${setSel}/>`)}</div>
  </section>
  <${ToysHome} onOpen=${setSel}/><${Why}/><${How}/><${Faq}/><${Contacts}/></main>${pg==="toys"&&html`<${ToysPage} onOpen=${setSel}/><${Contacts}/>`}<${Footer}/>
  <a href=${waLink()} target="_blank" rel="noopener noreferrer" aria-label="Написать в WhatsApp" className="fixed z-40 right-4 w-14 h-14 rounded-full flex items-center justify-center text-white shadow-xl" style=${{background:"#25a244",bottom:"calc(16px + env(safe-area-inset-bottom,0px))"}}><${IcWA}/></a>
  ${sel&&html`<${Modal} box=${sel} onClose=${()=>setSel(null)}/>`}
</${React.Fragment}>`};

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
